services:
  bobweb:
    image: bobcalypsoweb:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5080:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    container_name: bobcalypsoweb
